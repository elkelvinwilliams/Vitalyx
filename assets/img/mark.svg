<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Vytalix Y-node mark</title>
  <!-- The Y-node symbol: three strokes (people, care, data) meeting at an ember node, inside a Deep rounded square. -->
  <rect width="128" height="128" rx="28" fill="#123B4A"/>
  <g fill="none" stroke="#F7F4EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="34,30 64,66 94,30"/>
    <line x1="64" y1="66" x2="64" y2="104"/>
  </g>
  <circle cx="64" cy="66" r="11" fill="#BF3E27"/>
</svg>
