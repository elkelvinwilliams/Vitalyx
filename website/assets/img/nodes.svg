<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" aria-hidden="true" focusable="false">
  <!-- Three nodes: advice, delivery, product — and learning drawn from all three. Uses currentColor for theme-awareness. -->
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
    <path d="M120 300 C 200 240, 250 140, 300 100"/>
    <path d="M300 100 C 350 140, 400 240, 480 300"/>
    <path d="M120 300 C 220 330, 380 330, 480 300"/>
    <path d="M300 100 C 300 180, 300 230, 300 250"/>
    <path d="M120 300 C 190 280, 240 260, 300 250"/>
    <path d="M480 300 C 410 280, 360 260, 300 250"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="3">
    <circle cx="300" cy="100" r="16"/>
    <circle cx="120" cy="300" r="16"/>
    <circle cx="480" cy="300" r="16"/>
  </g>
  <circle cx="300" cy="250" r="11" fill="#BF3E27"/>
  <circle cx="300" cy="250" r="24" fill="none" stroke="#BF3E27" stroke-width="1.5" opacity="0.45"/>
</svg>
