<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Scale ladder"><rect width="760" height="400" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">How big this can get</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Each step needs a different company. The numbers are what the market allows, not a forecast.</text></g><text x="24" y="62" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">The whole UK maternity market is worth roughly £55m a year at full price and full coverage. So the UK alone</text><text x="24" y="78" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">cannot build a £1bn company. Africa and a licensed AI engine are what change the ceiling.</text><rect x="60" y="296" width="155" height="90" rx="6" fill="#1B7F4B" opacity="0.1"/><rect x="60" y="296" width="155" height="4" rx="2" fill="#1B7F4B"/><text x="72" y="320" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1B7F4B" text-anchor="start" font-weight="700" opacity="1">£1m a year</text><text x="72" y="338" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">2 UK hospitals, 1</text><text x="72" y="351" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">African programme, plus</text><text x="72" y="364" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">advisory work</text><text x="72" y="383" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">6–8 people</text><rect x="225" y="248" width="155" height="96" rx="6" fill="#153892" opacity="0.15000000000000002"/><rect x="225" y="248" width="155" height="4" rx="2" fill="#153892"/><text x="237" y="272" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#153892" text-anchor="start" font-weight="700" opacity="1">£10m a year</text><text x="237" y="290" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">25 UK maternity</text><text x="237" y="303" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">services, 3 country</text><text x="237" y="316" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">programmes, newborn</text><text x="237" y="329" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">module selling</text><text x="237" y="348" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">35 people</text><rect x="390" y="200" width="155" height="144" rx="6" fill="#153892" opacity="0.2"/><rect x="390" y="200" width="155" height="4" rx="2" fill="#153892"/><text x="402" y="224" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#153892" text-anchor="start" font-weight="700" opacity="1">£50m a year</text><text x="402" y="242" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Half the UK market, 5</text><text x="402" y="255" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">countries, government</text><text x="402" y="268" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">dashboards, AI engine</text><text x="402" y="281" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">licensed</text><text x="402" y="300" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">150 people</text><rect x="555" y="152" width="155" height="192" rx="6" fill="#5A6472" opacity="0.25"/><rect x="555" y="152" width="155" height="4" rx="2" fill="#5A6472"/><text x="567" y="176" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6472" text-anchor="start" font-weight="700" opacity="1">£100m+ a year</text><text x="567" y="194" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Several continents,</text><text x="567" y="207" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">research and data</text><text x="567" y="220" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">income, the standard</text><text x="567" y="233" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">others plug into</text><text x="567" y="252" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">300+ people</text></svg>