<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="The first 90 days"><rect width="760" height="320" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">The first 90 days</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Four blocks. Do them in order. Dates run from Monday 14 September 2026.</text></g><text x="136" y="112" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="end" font-weight="600" opacity="1">Days 1–7</text><rect x="150" y="96" width="44.800000000000004" height="30" rx="6" fill="#C93D63" opacity="0.16"/><rect x="150" y="96" width="4" height="30" rx="2" fill="#C93D63"/><text x="164" y="109" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C93D63" text-anchor="start" font-weight="700" opacity="1">Fix the blockers</text><text x="164" y="123" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Company registered, ownership agreed</text><text x="136" y="166" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="end" font-weight="600" opacity="1">Days 8–30</text><rect x="194.8" y="150" width="140.0" height="30" rx="6" fill="#153892" opacity="0.16"/><rect x="194.8" y="150" width="4" height="30" rx="2" fill="#153892"/><text x="208.8" y="163" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#153892" text-anchor="start" font-weight="700" opacity="1">Set up to sell</text><text x="208.8" y="177" font-family="Source Sans Pro, Segoe UI, Helvetic