<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Pricing comparison"><rect width="760" height="330" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">What to charge, per woman per year</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">The old proposal was far above anything comparable. These are the new numbers.</text></g><text x="176" y="118" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#10192B" text-anchor="end" font-weight="600" opacity="1">Old Ekiti proposal</text><line x1="190" y1="116" x2="670" y2="116" stroke="#F5F7FC" stroke-width="10" stroke-linecap="round"/><line x1="654.516129032258" y1="116" x2="658.516129032258" y2="116" stroke="#C93D63" stroke-width="10" stroke-linecap="round"/><text x="670.516129032258" y="121" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#C93D63" text-anchor="start" font-weight="700" opacity="1">£300</text><text x="176" y="134" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6472" text-anchor="end" font-weight="400" opacity="1">withdrawn</text><text x="176" y="178" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#10192B" text-anchor="end" font-weight="600" opacity="1">UK hospital</text><line x1="190" y1="176" x2="670" y2="176" stroke="#F5F7FC" stroke-width="10" stroke-linecap="round"/><line x1="217.8709677419355" y1="176" x2="245.74193548387098" y2="176" stroke="#153892" stroke-width="10" stroke-linecap="round"/><text x="257.741935483871" y="181" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#153892" text-anchor="start" font-weight="700" opacity="1">£18–£36</text><text x="176" y="194" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6472" text-anchor="end" font-weight="400" opacity="1">plus a site licence</text><text x="176" y="238" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#10192B" text-anchor="end" font-weight="600" opacity="1">African programme</text><line x1="190" y1="236" x2="670" y2="236" stroke="#F5F7FC" stroke-width="10" stroke-linecap="round"/><line x1="196.19354838709677" y1="236" x2="205.48387096774195" y2="236" stroke="#3E5FB0" stroke-width="10" stroke-linecap="round"/><text x="217.48387096774195" y="241" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3E5FB0" text-anchor="start" font-weight="700" opacity="1">£4–£10</text><text x="176" y="254" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A6472" text-anchor="end" font-weight="400" opacity="1">at scale</text><line x1="190.0" y1="94" x2="190.0" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="190.0" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£0</text><line x1="267.4193548387097" y1="94" x2="267.4193548387097" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="267.4193548387097" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£50</text><line x1="344.8387096774194" y1="94" x2="344.8387096774194" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="344.8387096774194" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£100</text><line x1="422.258064516129" y1="94" x2="422.258064516129" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="422.258064516129" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£150</text><line x1="499.6774193548387" y1="94" x2="499.6774193548387" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="499.6774193548387" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£200</text><line x1="577.0967741935484" y1="94" x2="577.0967741935484" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="577.0967741935484" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£250</text><line x1="654.516129032258" y1="94" x2="654.516129032258" y2="286" stroke="#D9DEE9" stroke-dasharray="2 4"/><text x="654.516129032258" y="302" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">£300</text><text x="90" y="340" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">A 15,000-woman programme is about £373,000 in year one, not £4.5m.</text></svg>