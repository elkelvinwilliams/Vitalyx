<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Funding stages"><rect width="760" height="340" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">How to raise money, in stages</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Each step is unlocked by proof, not by time passing.</text></g><rect x="70" y="244" width="152" height="86" rx="6" fill="#1B7F4B" opacity="0.1"/><rect x="70" y="244" width="152" height="4" rx="2" fill="#1B7F4B"/><text x="82" y="266" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1B7F4B" text-anchor="start" font-weight="700" opacity="1">Grants and services</text><text x="82" y="282" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">£0 dilution</text><text x="82" y="298" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">now</text><text x="82" y="312" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Innovate UK, SBRI, first clients</text><rect x="230" y="200" width="152" height="88" rx="6" fill="#153892" opacity="0.15000000000000002"/><rect x="230" y="200" width="152" height="4" rx="2" fill="#153892"/><text x="242" y="222" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#153892" text-anchor="start" font-weight="700" opacity="1">Pre-seed</text><text x="242" y="238" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">£250k–£500k</text><text x="242" y="254" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">after a hospital says yes</text><text x="242" y="268" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">angels, SEIS/EIS tax relief</text><rect x="390" y="156" width="152" height="132" rx="6" fill="#153892" opacity="0.2"/><rect x="390" y="156" width="152" height="4" rx="2" fill="#153892"/><text x="402" y="178" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#153892" text-anchor="start" font-weight="700" opacity="1">Seed</text><text x="402" y="194" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">£1.5m–£3m</text><text x="402" y="210" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">after a trial and first revenue</text><text x="402" y="224" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">health-tech funds</text><rect x="550" y="112" width="152" height="176" rx="6" fill="#5A6472" opacity="0.25"/><rect x="550" y="112" width="152" height="4" rx="2" fill="#5A6472"/><text x="562" y="134" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6472" text-anchor="start" font-weight="700" opacity="1">Series A</text><text x="562" y="150" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">£6m–£12m</text><text x="562" y="166" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">after real evidence</text><text x="562" y="180" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">2029 decision, not a plan</text><rect x="30" y="290" width="680" height="30" rx="6" fill="#FBF0F3"/><text x="44" y="310" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8A2B47" text-anchor="start" font-weight="600" opacity="1">Do not raise before the ownership agreement is signed and the old AI claims are withdrawn.</text></svg>