<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="Investor readiness"><rect width="760" height="340" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">Are you ready to talk to investors?</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Five of these must be green before your first meeting. Today, none are.</text></g><rect x="50" y="80" width="18" height="18" rx="4" fill="#C3CBDA" opacity="0.35"/><text x="78" y="94" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Company registered</text><rect x="50" y="110" width="18" height="18" rx="4" fill="#C3CBDA" opacity="0.35"/><text x="78" y="124" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Ownership of MaternaLink agreed in writing</text><rect x="50" y="140" width="18" height="18" rx="4" fill="#C3CBDA" opacity="0.35"/><text x="78" y="154" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Old AI claims withdrawn</text><rect x="50" y="170" width="18" height="18" rx="4" fill="#C3CBDA" opacity="0.35"/><text x="78" y="184" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Name and trademark checked</text><rect x="50" y="200" width="18" height="18" rx="4" fill="#C3CBDA" opacity="0.35"/><text x="78" y="214" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#