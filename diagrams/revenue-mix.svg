<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Revenue mix, middle case"><rect width="760" height="300" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">Where the money comes from (middle case)</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Services are most of the money for the first two years.</text></g><rect x="90" y="100" width="166.7066904792751" height="46" fill="#153892"/><text x="173.35334523963755" y="128" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">29%</text><rect x="256.7066904792751" y="100" width="174.41162485781282" height="46" fill="#3E5FB0"/><text x="343.9125029081815" y="128" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">30%</text><rect x="431.1183153370879" y="100" width="86.63202397901632" height="46" fill="#7E93CE"/><text x="474.4343273265961" y="128" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">15%</text><rect x="517.7503393161043" y="100" width="152.24966068389577" height="46" fill="#C93D63"/><text x="593.8751696580522" y="128" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">26%</text><rect x="90" y="100" width="580" height="46" fill="none" stroke="#D9DEE9"/><rect x="90" y="179" width="14" height="14" rx="3" fill="#153892"/><text x="112" y="190" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif"