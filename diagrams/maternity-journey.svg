<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="What MaternaLink covers"><rect width="760" height="260" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">What MaternaLink covers</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">From the first appointment to a year after the birth. The last part is where nobody else goes.</text></g><line x1="60" y1="140" x2="700" y2="140" stroke="#D9DEE9" stroke-width="4"/><line x1="60" y1="140" x2="412.0" y2="140" stroke="#153892" stroke-width="4"/><line x1="412.0" y1="140" x2="700" y2="140" stroke="#C93D63" stroke-width="4"/><circle cx="60.0" cy="140" r="9" fill="#fff" stroke="#153892" stroke-width="3"/><text x="60.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#153892" text-anchor="middle" font-weight="700" opacity="1">Booking</text><text x="60.0" y="130" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">~10 weeks</text><circle cx="188.0" cy="140" r="9" fill="#fff" stroke="#153892" stroke-width="3"/><text x="188.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#153892" text-anchor="middle" font-weight="700" opacity="1">16 weeks</text><text x="188.0" y="130" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">cuff issued</text><circle cx="316.0" cy="140" r="9" fill="#fff" stroke="#153892" stroke-width="3"/><text x="316.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#153892" text-anchor="middle" font-weight="700" opacity="1">Pregnancy</text><text x="316.0" y="130" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">checks at home</text><circle cx="444.0" cy="140" r="9" fill="#fff" stroke="#10192B" stroke-width="3"/><text x="444.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#10192B" text-anchor="middle" font-weight="700" opacity="1">Birth</text><circle cx="572.0" cy="140" r="9" fill="#fff" stroke="#C93D63" stroke-width="3"/><text x="572.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C93D63" text-anchor="middle" font-weight="700" opacity="1">6 weeks</text><text x="572.0" y="130" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">handover to GP</text><circle cx="700.0" cy="140" r="9" fill="#fff" stroke="#C93D63" stroke-width="3"/><text x="700.0" y="116" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#C93D63" text-anchor="middle" font-weight="700" opacity="1">1 year</text><text x="700.0" y="130" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="middle" font-weight="400" opacity="1">follow-up ends</text><text x="232.8" y="174" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#153892" text-anchor="middle" font-weight="600" opacity="1">Pregnancy: stay in contact between appointments</text><text x="559.2" y="174" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C93D63" text-anchor="middle" font-weight="600" opacity="1">The year after birth: where most late deaths happen</text><text x="559.2" y="190" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C93D63" text-anchor="middle" font-weight="400" opacity="1">and where no other product goes</text></svg>