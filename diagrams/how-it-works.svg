<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="How MaternaLink works"><rect width="760" height="270" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">How it works</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">A person decides, not the software. That is what keeps it safe and legal.</text></g><rect x="30" y="110" width="136" height="92" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><circle cx="48" cy="132" r="11" fill="#153892"/><text x="48" y="136" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">1</text><text x="42" y="162" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">She takes a</text><text x="42" y="177" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">reading</text><text x="42" y="196" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">at home, works offline</text><path d="M 168 156 l 8 0" stroke="#5A6472" stroke-width="2" marker-end="url(#ar)"/><rect x="178" y="110" width="136" height="92" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><circle cx="196" cy="132" r="11" fill="#153892"/><text x="196" y="136" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">2</text><text x="190" y="162" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">The hospital</text><text x="190" y="177" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">rule checks it</text><text x="190" y="196" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">rules your clinicians set</text><path d="M 316 156 l 8 0" stroke="#5A6472" stroke-width="2" marker-end="url(#ar)"/><rect x="326" y="110" width="136" height="92" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><circle cx="344" cy="132" r="11" fill="#C93D63"/><text x="344" y="136" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">3</text><text x="338" y="162" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">A midwife is</text><text x="338" y="177" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">told</text><text x="338" y="196" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">with a deadline to call</text><path d="M 464 156 l 8 0" stroke="#5A6472" stroke-width="2" marker-end="url(#ar)"/><rect x="474" y="110" width="136" height="92" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><circle cx="492" cy="132" r="11" fill="#1B7F4B"/><text x="492" y="136" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">4</text><text x="486" y="162" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">The midwife</text><text x="486" y="177" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">decides</text><text x="486" y="196" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">and calls her</text><path d="M 612 156 l 8 0" stroke="#5A6472" stroke-width="2" marker-end="url(#ar)"/><rect x="622" y="110" width="136" height="92" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><circle cx="640" cy="132" r="11" fill="#10192B"/><text x="640" y="136" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" opacity="1">5</text><text x="634" y="162" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">It is written</text><text x="634" y="177" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#10192B" text-anchor="start" font-weight="600" opacity="1">down</text><text x="634" y="196" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">who, when, what happened</text><defs><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#5A6472"/></marker></defs><rect x="30" y="220" width="700" height="30" rx="6" fill="#FBF0F3"/><text x="44" y="239" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A2B47" text-anchor="start" font-weight="400" opacity="1">The software never diagnoses, predicts or recommends treatment. It moves information to a human quickly.</text></svg>