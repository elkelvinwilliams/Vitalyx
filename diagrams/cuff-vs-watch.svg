<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Cuff versus watch"><rect width="760" height="270" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">Cuff now, watch later</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Why the wrist device is not the first thing to build.</text></g><rect x="30" y="70" width="220" height="175" rx="9" fill="#fff" stroke="#1B7F4B" stroke-width="1.5" opacity="1"/><rect x="30" y="70" width="220" height="26" rx="9" fill="#1B7F4B" opacity="0.14"/><text x="44" y="88" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1B7F4B" text-anchor="start" font-weight="700" opacity="1">Arm cuff (now)</text><text x="44" y="112" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✓ Already approved for medical</text><text x="54" y="125" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">use</text><text x="44" y="145" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✓ £40–£100 each</text><text x="44" y="178" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✓ Doctors trust the readings</text><text x="44" y="211" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✓ You can start in months</text><rect x="270" y="70" width="220" height="175" rx="9" fill="#fff" stroke="#B76A00" stroke-width="1.5" opacity="1"/><rect x="270" y="70" width="220" height="26" rx="9" fill="#B76A00" opacity="0.14"/><text x="284" y="88" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#B76A00" text-anchor="start" font-weight="700" opacity="1">Rented certified watch (later)</text><text x="284" y="112" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">• Someone else carries the</text><text x="294" y="125" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">safety risk</text><text x="284" y="145" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">• £4–£7 per month to rent</text><text x="284" y="178" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">• Only after the software</text><text x="294" y="191" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">works</text><text x="284" y="211" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">• Adds convenience, not</text><text x="294" y="224" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">accuracy</text><rect x="510" y="70" width="220" height="175" rx="9" fill="#fff" stroke="#B3261E" stroke-width="1.5" opacity="1"/><rect x="510" y="70" width="220" height="26" rx="9" fill="#B3261E" opacity="0.14"/><text x="524" y="88" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#B3261E" text-anchor="start" font-weight="700" opacity="1">Build your own watch</text><text x="524" y="112" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✗ Two years and £1m+ before a</text><text x="534" y="125" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">sale</text><text x="524" y="145" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✗ You become a device</text><text x="534" y="158" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">manufacturer</text><text x="524" y="178" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✗ Wrist blood pressure is not</text><text x="534" y="191" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">accurate enough</text><text x="524" y="211" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">✗ Doctors will not act on it</text></svg>