<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Document map"><rect width="760" height="330" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">What to read, and when</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Fourteen documents. You do not need to read them all at once.</text></g><rect x="30" y="72" width="168" height="30" rx="6" fill="#C93D63" opacity="0.14"/><text x="44" y="92" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#C93D63" text-anchor="start" font-weight="700" opacity="1">Read this week</text><rect x="30" y="112" width="168" height="32" rx="5" fill="#F5F7FC" stroke="#D9DEE9"/><text x="42" y="132" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">00 Start here</text><rect x="30" y="150" width="168" height="32" rx="5" fill="#F5F7FC" stroke="#D9DEE9"/><text x="42" y="170" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">01 Where you stand</text><rect x="30" y="188" width="168" height="32" rx="5" fill="#F5F7FC" stroke="#D9DEE9"/><text x="42" y="208" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">02 What we are building</text><rect x="30" y="226" width="168" height="32" rx="5" fill="#F5F7FC" stroke="#D9DEE9"/><text x="42" y="246" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#10192B" text-anchor="start" font-weight="400" opacity="1"