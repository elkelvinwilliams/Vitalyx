<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Have, building, next"><rect width="760" height="270" fill="#FFFFFF"/><g transform="translate(24,24)"><text x="0" y="20" font-family="Source Serif Pro, Georgia, serif" font-size="17" fill="#153892" text-anchor="start" font-weight="600" opacity="1">What you have, what you are building, what comes next</text><text x="0" y="40" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5A6472" text-anchor="start" font-weight="400" opacity="1">Say it in this order to investors. Never inflate the first column.</text></g><rect x="40" y="70" width="220" height="170" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><rect x="40" y="70" width="220" height="4" rx="2" fill="#5A6472"/><text x="56" y="98" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5A6472" text-anchor="start" font-weight="700" opacity="1">What you have</text><circle cx="62" cy="119" r="3" fill="#5A6472"/><text x="74" y="123" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A full company plan</text><circle cx="62" cy="147" r="3" fill="#5A6472"/><text x="74" y="151" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A prototype (needs an audit)</text><circle cx="62" cy="175" r="3" fill="#5A6472"/><text x="74" y="179" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A past government conversation</text><circle cx="62" cy="203" r="3" fill="#5A6472"/><text x="74" y="207" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A logo and two websites</text><rect x="280" y="70" width="220" height="170" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><rect x="280" y="70" width="220" height="4" rx="2" fill="#153892"/><text x="296" y="98" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#153892" text-anchor="start" font-weight="700" opacity="1">Building now</text><circle cx="302" cy="119" r="3" fill="#153892"/><text x="314" y="123" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">The company itself</text><circle cx="302" cy="147" r="3" fill="#153892"/><text x="314" y="151" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">Ownership agreement</text><circle cx="302" cy="175" r="3" fill="#153892"/><text x="314" y="179" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">First advisory clients</text><circle cx="302" cy="203" r="3" fill="#153892"/><text x="314" y="207" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A hospital trial</text><rect x="520" y="70" width="220" height="170" rx="9" fill="#F5F7FC" stroke="#D9DEE9"/><rect x="520" y="70" width="220" height="4" rx="2" fill="#1B7F4B"/><text x="536" y="98" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1B7F4B" text-anchor="start" font-weight="700" opacity="1">Next</text><circle cx="542" cy="119" r="3" fill="#1B7F4B"/><text x="554" y="123" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">First paying customer</text><circle cx="542" cy="147" r="3" fill="#1B7F4B"/><text x="554" y="151" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">A signed pilot</text><circle cx="542" cy="175" r="3" fill="#1B7F4B"/><text x="554" y="179" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">Advisers on board</text><circle cx="542" cy="203" r="3" fill="#1B7F4B"/><text x="554" y="207" font-family="Source Sans Pro, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#10192B" text-anchor="start" font-weight="400" opacity="1">Pre-seed round</text></svg>